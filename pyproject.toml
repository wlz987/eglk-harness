[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eglk-harness"
version = "0.1.0b1"
description = "Evidence-Gated Loop Kernel harness (eglk) for long-horizon agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eglk" }]
dependencies = [
  "eba @ git+https://github.com/wlz987/eba.git",
  "eba-job @ git+https://github.com/wlz987/eba_job.git",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
eval = [
  "playwright>=1.40",
  "mcp>=1.0",
]

[project.scripts]
eglk-harness = "eglk_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eglk_harness = [
  "domain/schemas/*.json",
  "domain/schemas/README.md",
  "domain/memory/skills/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
